<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game</title>
  <link href="./bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100 text-white">
    <h1 class="text-white mb-4">Avengers Memory Game</h1>
    <br>
  <div class="container mt-4 text-center">

    <div class="progress mb-3" >
      <div class="progress-bar bg-success progress-bar-animated" role="progressbar" aria-label="Animated striped example" style="width: 0%">0%</div>
    </div>


    <div id="gameBoard" class="game-board"></div>


    <button id="restartBtn" class="btn btn-dark mt-3">Restart</button>
  </div>

  <script src="./bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>

</html>
